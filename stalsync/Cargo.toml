[package]
name = "stalsync"
version = "0.1.0"
edition = "2024"
description = "Sincronización N-way de discos locales: sin maestro, conflictos por mtime, papelera de borrados"
license = "MIT"
repository = "https://github.com/josedejesuschavez/stalsync"
homepage = "https://github.com/josedejesuschavez/stalsync"
documentation = "https://github.com/josedejesuschavez/stalsync#readme"
keywords = ["sync", "backup", "n-way", "replication", "files"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.85"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2.29"
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"

[dev-dependencies]
blake3 = "1.8.7"
filetime = "0.2.29"
tempfile = "3.27.0"
